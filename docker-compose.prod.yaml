services:
  stig:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - CORP_PROXY_CA_URL=${CORP_PROXY_CA_URL:-}
        - CORP_PROXY_INSECURE_SSL=${CORP_PROXY_INSECURE_SSL:-false}
    container_name: stig-api
    ports:
      - '3000:3000'
    depends_on:
      - neo4j
    environment:
      - PORT=3000
      - NEO4J_AUTOCONNECT=${NEO4J_AUTOCONNECT:-false}
      - NEO4J_HOST=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - NEO4J_DATABASE=neo4j
  neo4j:
    build:
      context: .
      dockerfile: Dockerfile.neo
    hostname: neo4j
    container_name: neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - ./neo4jdata/data:/data
      - ./neo4jdata/logs:/logs
      - ./neo4jdata/conf:/conf/
      - ./neo4jdata/import:/var/lib/neo4j/import
      - ./neo4jdata/plugins:/plugins
    environment:
      - NEO4J_AUTH=${NEO4J_AUTH}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted="apoc.*"
    extra_hosts:
      - "host.docker.internal:host-gateway"
